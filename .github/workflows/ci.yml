# Runs the same checks we run before each commit, on GitHub's machines, for every PR and every
# push to main. Branch protection on main requires this "checks" job to pass before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# If a PR gets a new push while checks are still running, cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
