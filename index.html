<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f7f5" />
    <!-- Applies the saved light/dark choice before the first paint (see src/lib/theme.ts). -->
    <script src="/theme.js"></script>
    <!-- iPhone: open full-screen from the home screen, with a light status bar and a short name. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Swipe" />
    <meta name="description" content="Review your credit-card statement one swipe at a time." />
    <title>Statement Swipe</title>
  </head>
  <body>
    <!-- The launch screen: the app's logo, shown from the very first paint (before the app's code has
         loaded) until saved statements are ready, then faded away by src/lib/splash.ts. -->
    <div id="splash" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="112" fill="#0A7D4F"/>
        <rect x="160" y="116" width="220" height="286" rx="28" fill="#E5F4EC" transform="rotate(8 270 259)"/>
        <rect x="132" y="112" width="220" height="286" rx="28" fill="#FFFFFF"/>
        <rect x="164" y="152" width="96" height="16" rx="8" fill="#E1E8E4"/>
        <rect x="164" y="206" width="150" height="36" rx="10" fill="#0F1F17"/>
        <circle cx="302" cy="344" r="30" fill="#0A7D4F"/>
        <path d="M288 344l10 10 20-20" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
